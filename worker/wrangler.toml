name = "research-library-editor"
main = "src/index.ts"
compatibility_date = "2026-09-13"

[vars]
# Repository-specific non-secret values. The Owner is read from config/research-profile.yaml.
GITHUB_REPOSITORY = "OWNER/REPOSITORY"
GITHUB_BRANCH = "main"

# Create with `wrangler d1 create research-library-comments`, then replace the placeholder.
[[d1_databases]]
binding = "COMMENTS_DB"
database_name = "research-library-comments"
database_id = "REPLACE_WITH_D1_DATABASE_ID"
